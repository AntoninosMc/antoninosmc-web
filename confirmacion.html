<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzería - Confirmación</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <header> 
    <div class="menu">
      <a href="index.html"><img src="img/antoninosLogo.png" alt="logo"></a>
      <nav class="navbar">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="pedidos.html">Pedido</a></li>
          <li><a href="pizzas.html">Pizzas</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <main class="extra">

    <section id="confirmacion-pedido" class="container confirmacion">
      <div class="confirmacion-card">
        <img src="img/moto.png" alt="pizza-confirmacion">
      </div>

      <!-- Formulario para ingresar los datos del cliente -->
      <div class="confirmacion">
        <form id="formulario">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required><br><br>
      
          <label for="direccion">Dirección:</label>
          <input type="text" id="direccion" name="direccion" required><br><br>
      
          <label for="celular">Celular:</label>
          <input type="tel" id="celular" name="celular" required><br><br>
      
          <label for="correo">Correo:</label>
          <input type="email" id="correo" name="correo" required><br><br>
      
          <button type="submit" id="guardarDatos" >Enviar</button>
        </form>
      </div>

    </section>

  </main>
  
  <footer>
    <div class="grupo-1 container">
      <div class="box">
        <a href="#"><img src="img/antoninosLogo.png" alt="antoninosLogo"></a>
      </div>

      <div class="box">
        <h2> SOBRE NOSOTROS </h2>
        <p>AntoninosMC permite a los clientes personalizar su pizza de manera única, eligiendo tanto los ingredientes como la cantidad de cada uno.</p>
      </div>
      <div class="box">
        <h2>NAVEGA</h2>
        <nav class="link-footer">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="pedidos.html">Pedido</a></li>
            <li><a href="pizzas.html">Pizzas</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </footer>
  
  <script src="./js/app.js"></script>
</body>

</html>
